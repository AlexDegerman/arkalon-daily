name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.,!node_modules,!.next,!.git'
          target: /opt/arkalon/arkalon-daily/repo
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/arkalon/arkalon-daily

            # Tag current image for rollback
            DEPLOY_SHA=${{ github.sha }}
            echo "Deploying $DEPLOY_SHA"

            # Build new image
            docker build \
              --tag arkalon-daily:$DEPLOY_SHA \
              --tag arkalon-daily:latest \
              repo/

            # Bring up new container
            docker compose up -d --remove-orphans

            # Prune old images (keep last 3)
            docker images arkalon-daily --format '{{.Tag}}' \
              | grep -v latest \
              | sort -r \
              | tail -n +4 \
              | xargs -r -I {} docker rmi arkalon-daily:{} || true

            echo "Deploy complete: $DEPLOY_SHA"