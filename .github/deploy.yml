name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: daily-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy source code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.,!node_modules,!.next,!.git,!.env*,!*.log,!.github,!.vscode'
          target: /opt/arkalon/arkalon-daily/
          overwrite: true
          rm: false

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/arkalon/arkalon-daily
            export DEPLOY_SHA="${{ steps.sha.outputs.short }}"

            echo "Building image for commit: ${DEPLOY_SHA}"
            docker build -t "arkalon-daily:${DEPLOY_SHA}" -t "arkalon-daily:latest" .

            echo "Restarting container with new image..."
            DEPLOY_SHA="${DEPLOY_SHA}" docker compose up -d --force-recreate

            echo "Waiting 10s for healthcheck..."
            sleep 10

            docker exec arkalon-daily node -e "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

            echo "Deployment of ${DEPLOY_SHA} complete and healthy!"