name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://daily.arkalon.fi
          # Dummy server-only vars so the build resolves imports without
          # real credentials - these are never used at build time
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_SSL: 'false'
          HMAC_SERVER_SECRET: dummy_secret_for_ci_build_only
          CRON_SECRET: dummy_cron_secret_for_ci_build_only