<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <!-- Canvas Base -->
  <rect width="1000" height="780" fill="#0A0E14"/>

  <!-- Subtle Blueprint Tech Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121A24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="780" fill="url(#grid)"/>

  <!-- Header Section -->
  <text x="50" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#00FF88" letter-spacing="2">ARKALON DAILY // ASSET SYSTEM REVIEW</text>
  <text x="50" y="78" font-family="sans-serif" font-size="12" fill="#64748B">SPEC: 40deg PARALLEL CUT - 15.8% MASTER STROKE - TANGENTIAL 4-5 O'CLOCK PAWLS - 1.5% OVERSHOOT</text>
  <line x1="50" y1="95" x2="950" y2="95" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Row 1: Primary Marks -->
  <!-- 1. App Icon -->
  <g transform="translate(50, 120)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">APP ICON (512px)</text>
    <rect width="160" height="160" rx="36" fill="#090D13" stroke="#00FF88" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(20, 20) scale(0.6)" fill="#00FF88">
      <path d="M 126 42 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 38 168 L 38 32 L 98 30 L 102 30 L 76 52 L 61 52 L 61 148 L 98 148 A 48 48 0 0 0 136 100 A 48 48 0 0 0 108 62 Z"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
    </g>
  </g>

  <!-- 2. Dark Emblem Card -->
  <g transform="translate(240, 120)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">EMBLEM (DARK CARD)</text>
    <rect width="160" height="160" rx="28" fill="#0B0F14" stroke="#1E293B" stroke-width="1.5"/>
    <g transform="translate(5, 5) scale(0.75)" fill="#00FF88">
      <path d="M 126 42 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 38 168 L 38 32 L 98 30 L 102 30 L 76 52 L 61 52 L 61 148 L 98 148 A 48 48 0 0 0 136 100 A 48 48 0 0 0 108 62 Z"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
    </g>
  </g>

  <!-- 3. Avatar -->
  <g transform="translate(430, 120)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">AVATAR (CIRCLE)</text>
    <circle cx="80" cy="80" r="80" fill="#0B1017" stroke="#00FF88" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(10, 10) scale(0.7)" fill="#00FF88">
      <path d="M 126 42 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 38 168 L 38 32 L 98 30 L 102 30 L 76 52 L 61 52 L 61 148 L 98 148 A 48 48 0 0 0 136 100 A 48 48 0 0 0 108 62 Z"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
    </g>
  </g>

  <!-- 4. Micro Favicons -->
  <g transform="translate(630, 120)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">MICRO 1D SUITE</text>
    <rect width="320" height="160" rx="20" fill="#0E1520" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- 64px -->
    <g transform="translate(24, 48)">
      <rect width="64" height="64" rx="14" fill="#0B0F14" stroke="#00FF88" stroke-width="1" stroke-opacity="0.2"/>
      <g transform="scale(0.32)" fill="#00FF88">
        <path d="M 128 44 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 36 168 L 36 32 L 98 30 L 102 30 L 78 52 L 59 52 L 59 148 L 98 148 A 47 47 0 0 0 135 100 A 47 47 0 0 0 110 63 Z"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(15)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(35)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(55)"/>
      </g>
      <text x="32" y="80" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">64px</text>
    </g>

    <!-- 32px -->
    <g transform="translate(125, 64)">
      <rect width="32" height="32" rx="7" fill="#0B0F14" stroke="#00FF88" stroke-width="1" stroke-opacity="0.2"/>
      <g transform="scale(0.16)" fill="#00FF88">
        <path d="M 128 44 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 36 168 L 36 32 L 98 30 L 102 30 L 78 52 L 59 52 L 59 148 L 98 148 A 47 47 0 0 0 135 100 A 47 47 0 0 0 110 63 Z"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(15)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(35)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(55)"/>
      </g>
      <text x="16" y="48" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">32px</text>
    </g>

    <!-- 16px -->
    <g transform="translate(195, 72)">
      <rect width="16" height="16" rx="4" fill="#0B0F14" stroke="#00FF88" stroke-width="1" stroke-opacity="0.2"/>
      <g transform="scale(0.08)" fill="#00FF88">
        <path d="M 128 44 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 36 168 L 36 32 L 98 30 L 102 30 L 78 52 L 59 52 L 59 148 L 98 148 A 47 47 0 0 0 135 100 A 47 47 0 0 0 110 63 Z"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(15)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(35)"/>
        <rect x="60" y="-5" width="12" height="10" transform="translate(96,100) rotate(55)"/>
      </g>
      <text x="8" y="32" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">16px</text>
    </g>
  </g>

  <!-- Row 2: In-Context App Header Lockup (Matching Game UI in Image 3) -->
  <g transform="translate(50, 340)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">HORIZONTAL HEADER LOCKUP (APP TITLE BAR)</text>
    <rect width="900" height="90" rx="16" fill="#0C1118" stroke="#1A2534" stroke-width="1.5"/>
    <g transform="translate(30, 16) scale(0.29)" fill="#00FF88">
      <path d="M 126 42 A 70 70 0 0 1 158 100 A 70 70 0 0 1 98 170 L 38 168 L 38 32 L 98 30 L 102 30 L 76 52 L 61 52 L 61 148 L 98 148 A 48 48 0 0 0 136 100 A 48 48 0 0 0 108 62 Z"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
      <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
    </g>
    <text x="105" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="#00FF88">ARKALON DAILY</text>
    
    <!-- UI Dummy Icons on right (Docs and Sound matching Image 3) -->
    <rect x="800" y="27" width="36" height="36" rx="8" fill="#141E2B" stroke="#253548"/>
    <rect x="848" y="27" width="36" height="36" rx="8" fill="#141E2B" stroke="#253548"/>
  </g>

  <!-- Row 3: Wordmark and Spec Summary -->
  <g transform="translate(50, 480)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">STANDALONE WORDMARK</text>
    <rect width="440" height="110" rx="16" fill="#0B0F14" stroke="#1E293B" stroke-width="1.5"/>
    <text x="35" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="30" letter-spacing="5" fill="#00FF88">ARKALON DAILY</text>
  </g>

  <g transform="translate(510, 480)">
    <text x="0" y="-12" font-family="monospace" font-size="11" fill="#94A3B8">FREEZE SPECIFICATION METRICS</text>
    <rect width="440" height="240" rx="16" fill="#080C11" stroke="#1A2534" stroke-width="1.5"/>
    <text x="24" y="36" font-family="monospace" font-size="12" fill="#00FF88">- CUT-FACE ANGLE:</text>
    <text x="210" y="36" font-family="monospace" font-size="12" fill="#94A3B8">40.0deg parallel slice</text>

    <text x="24" y="68" font-family="monospace" font-size="12" fill="#00FF88">- STROKE RATIO:</text>
    <text x="210" y="68" font-family="monospace" font-size="12" fill="#94A3B8">15.8% (Master) / 16.5% (Micro)</text>

    <text x="24" y="100" font-family="monospace" font-size="12" fill="#00FF88">- TEETH PROFILE:</text>
    <text x="210" y="100" font-family="monospace" font-size="12" fill="#94A3B8">3 tangential pawls (15deg, 35deg, 55deg)</text>

    <text x="24" y="132" font-family="monospace" font-size="12" fill="#00FF88">- TEETH DEPTH:</text>
    <text x="210" y="132" font-family="monospace" font-size="12" fill="#94A3B8">Strictly 0.5x stroke (11px)</text>

    <text x="24" y="164" font-family="monospace" font-size="12" fill="#00FF88">- OPTICAL OVERSHOOT:</text>
    <text x="210" y="164" font-family="monospace" font-size="12" fill="#94A3B8">1.5% cap-height (bowl only)</text>

    <text x="24" y="196" font-family="monospace" font-size="12" fill="#00FF88">- MASS COMPENSATION:</text>
    <text x="210" y="196" font-family="monospace" font-size="12" fill="#94A3B8">+1.1% rightward counter shift</text>

    <text x="24" y="224" font-family="monospace" font-size="12" fill="#00FF88">- BOUNDING DISCIPLINE:</text>
    <text x="210" y="224" font-family="monospace" font-size="12" fill="#94A3B8">Zero teeth overshoot beyond cap box</text>
  </g>
</svg>
