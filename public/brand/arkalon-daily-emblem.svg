<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!--
    ARKALON DAILY — FROZEN SPECIFICATION SHEET (MASTER 1B)
    • Notch Angle: 40° parallel cut matching Network terminal cut
    • Stroke Ratio: 15.8% (22px on 140px cap-height)
    • Teeth: 3 tangential pawls, square-cut, depth = 0.5× stroke (11px), 20° equal spacing (15°, 35°, 55°)
    • Optical Overshoot: 1.5% cap-height (y=30 to y=170 on bowl, y=32 to y=168 on spine)
    • Mass Compensation: Counter nudged +1.1% toward teeth side (x=61)
    • Bounding Discipline: Strict cap-height confinement (x <= 174, y <= 170)
  -->
  <rect width="200" height="200" rx="36" fill="#0B0F14"/>
  <g fill="#00FF88">
    <!-- Master 1B Hollow D Hull -->
    <path d="
      M 126 42
      A 70 70 0 0 1 158 100
      A 70 70 0 0 1 98 170
      L 38 168
      L 38 32
      L 98 30
      L 102 30
      L 76 52
      L 61 52
      L 61 148
      L 98 148
      A 48 48 0 0 0 136 100
      A 48 48 0 0 0 108 62
      Z
    "/>
    <!-- Tangential 4-5 o'Clock Pawls (0.5× Stroke Depth) -->
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
  </g>
</svg>
