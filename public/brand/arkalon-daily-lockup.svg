<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%">
  <!-- ARKALON DAILY — HEADER LOCKUP -->
  <defs>
    <filter id="lockup-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Master 1B Left Emblem -->
  <g transform="translate(14, 10) scale(0.428)" fill="#00FF88">
    <path d="
      M 126 42
      A 70 70 0 0 1 158 100
      A 70 70 0 0 1 98 170
      L 38 168
      L 38 32
      L 98 30
      L 102 30
      L 76 52
      L 61 52
      L 61 148
      L 98 148
      A 48 48 0 0 0 136 100
      A 48 48 0 0 0 108 62
      Z
    "/>
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(15)"/>
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(35)"/>
    <rect x="60" y="-5" width="11" height="10" transform="translate(96,100) rotate(55)"/>
  </g>

  <!-- Typography with Neon Bloom -->
  <g fill="#00FF88" filter="url(#lockup-glow)">
    <text x="110" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" letter-spacing="3.5">ARKALON DAILY</text>
  </g>
</svg>
